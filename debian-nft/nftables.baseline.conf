#!/usr/sbin/nft -f
add table ip firewall
delete table ip firewall
add table ip6 firewall
delete table ip6 firewall
table ip firewall {
	set management {
		type ipv4_addr
		flags interval, auto-merge
		comment "allowed management hosts"
	}

	chain input {
		type filter hook input priority filter; policy drop;
		ct state invalid drop comment "fwdynhosts:invalid"
		ct state established,related accept comment "fwdynhosts:established"
		iifname "lo" accept comment "fwdynhosts:loopback"
		icmp type { destination-unreachable, time-exceeded, parameter-problem } accept comment "fwdynhosts:icmp-errors"
		ip saddr @management icmp type echo-request accept comment "fwdynhosts:echo"
		ip saddr @management tcp dport 22 accept comment "fwdynhosts:ssh"
		ip saddr @management tcp dport 8443 accept comment "fwdynhosts:unifi-legacy"
		ip saddr @management tcp dport 11443 accept comment "fwdynhosts:unifi-os"
		tcp dport 8080 accept comment "fwdynhosts:inform"
		udp dport 3478 accept comment "fwdynhosts:stun"
		udp dport 5514 accept comment "fwdynhosts:syslog"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		# This host does not route. Podman owns its own tables.
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
table ip6 firewall {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state invalid drop comment "fwdynhosts:invalid"
		ct state established,related accept comment "fwdynhosts:established"
		iifname "lo" accept comment "fwdynhosts:loopback"
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept comment "fwdynhosts:icmpv6"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		# This host does not route. Podman owns its own tables.
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
